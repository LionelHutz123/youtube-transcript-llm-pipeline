[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-transcript-llm-pipeline"
version = "0.2.0"
description = "Turn YouTube captions into timestamped, LLM-ready JSONL chunks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Contributors" }]
keywords = ["youtube", "transcript", "llm", "rag", "captions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "requests>=2.32,<3",
  "urllib3>=2,<3",
  "youtube-transcript-api>=1.2.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
yt-transcript = "youtube_transcript_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
